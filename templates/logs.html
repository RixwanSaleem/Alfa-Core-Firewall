<!DOCTYPE html>
<html lang="en">
<head>
    <title>AlfaCore - Monitoring</title>
    <!-- Auto-refresh page every 10 seconds -->
    <meta http-equiv="refresh" content="10">
    <style>
        /* Shared CSS from proxy.html above */
        :root { --bg: #020617; --sidebar: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --muted: #64748b; --line: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid var(--line); padding: 40px 24px; display: flex; flex-direction: column; flex-shrink: 0; }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 40px; color: white; text-decoration: none; display: flex; align-items: center; gap: 12px; }
        .logo span { color: var(--accent); }
        .nav-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        .nav-link { color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 8px; transition: 0.2s; }
        .nav-link.active { background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.15); }
        .content { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; height: 100vh; }
        .card { background: var(--card); padding: 24px; border-radius: 20px; border: 1px solid var(--line); flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;}
        .title { font-size: 14px; font-weight: 700; color: var(--accent); text-transform: uppercase; margin-bottom: 20px; }
        .log-viewport { background: #000; color: #4ade80; flex-grow: 1; border-radius: 15px; padding: 20px; font-family: 'Fira Code', monospace; font-size: 12px; overflow-y: auto; white-space: pre-wrap; border: 1px solid var(--line); }
    </style>
</head>
<body>
<div class="sidebar">
    <a href="/" class="logo">ALFA<span>CORE</span></a>
    <span class="nav-label">Main Console</span>
    <a href="/" class="nav-link">Dashboard</a>
    <span class="nav-label" style="margin-top:20px;">Services</span>
    <a href="/proxy" class="nav-link">Proxy Server</a>
    <a href="/firewall" class="nav-link">Firewall</a>
    <a href="/logs" class="nav-link active">Access Logs</a>
    <a href="/network" class="nav-link">Networks</a>
    <a href="/vpns" class="nav-link">VPNs</a>
    <span class="nav-label" style="margin-top:20px;">System</span>
    <a href="/system" class="nav-link">System Settings</a>
    <a href="/admin" class="nav-link">Administration</a>
    <div style="margin-top:auto;"><a href="/logout" class="nav-link" style="color:var(--red)">Logout</a></div>
</div>

<div class="content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h2 style="font-size:24px;">Traffic Stream</h2>
        <div style="display:flex; align-items:center; gap:8px;">
            <div style="width:8px; height:8px; background:var(--green); border-radius:50%; box-shadow: 0 0 10px var(--green);"></div>
            <span style="font-size:12px; font-weight:600; color:var(--accent);">Live Monitoring (Auto-Refresh)</span>
        </div>
    </div>
    <div class="card">
        <div class="title">Squid Access Logs (Last 100 Entries)</div>
        <div class="log-viewport" id="logView">{{ logs }}</div>
    </div>
</div>

<script>
    // Keep log view at bottom
    const logView = document.getElementById('logView');
    if (logView) {
        logView.scrollTop = logView.scrollHeight;
    }
</script>
</body>
</html>
