<!DOCTYPE html>
<html lang="{{ get_user_language(request) }}" dir="{{ 'rtl' if get_user_language(request)=='ar' else 'ltr' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t(request, "login_title") }}</title>
    <style>
        :root { --bg: #041026; --surface: #091a36; --accent: #38bdf8; --text: #eef2ff; --muted: #94a3b8; --danger: #fb7185; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: 'Inter', sans-serif; background: radial-gradient(circle at top left, rgba(56,189,248,0.18), transparent 22%), linear-gradient(180deg, #020618 0%, #041026 100%); color: var(--text); }
        .login-card { width: min(420px, calc(100% - 32px)); background: rgba(7, 18, 38, 0.95); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; padding: 36px; box-shadow: 0 36px 88px rgba(0,0,0,0.35); }
        .login-card h2 { margin: 0 0 20px; font-size: 1.95rem; letter-spacing: -0.04em; }
        .field-group { display: grid; gap: 10px; margin-bottom: 18px; }
        label { color: var(--muted); font-size: 0.95rem; }
        input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05); color: var(--text); font-size: 1rem; }
        button { width: 100%; padding: 14px 16px; border-radius: 14px; border: none; background: var(--accent); color: #041026; font-weight: 700; font-size: 1rem; cursor: pointer; }
        .error { background: rgba(251,113,133,0.16); border: 1px solid rgba(251,113,133,0.24); border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; color: #fee2e2; }
        .footer { margin-top: 16px; color: var(--muted); font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>{{ t(request, "login_title") }}</h2>
        {% if request.query_params.get('error') %}
            <div class="error">{{ t(request, "login_error") }}</div>
        {% endif %}
        <form method="post" action="/login">
            <div class="field-group"><label>{{ t(request, "login_username") }}</label><input type="text" name="username" required></div>
            <div class="field-group"><label>{{ t(request, "login_password") }}</label><input type="password" name="password" required></div>
            <button type="submit">{{ t(request, "login_signin") }}</button>
        </form>
        <div class="footer">© 2024 AlfaCore</div>
    </div>
</body>
</html>
