<!DOCTYPE html>
<html lang="en">
<head>
    <title>AlfaCore - {{ service_label }} Configuration</title>
    <style>
        :root { --bg: #020617; --sidebar: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --muted: #64748b; --green: #10b981; --red: #f43f5e; --line: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid var(--line); padding: 40px 24px; display: flex; flex-direction: column; flex-shrink: 0; }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 40px; color: white; text-decoration: none; display: block; }
        .nav-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        .nav-link { color: var(--text); text-decoration: none; padding: 12px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 8px; display: block; }
        .nav-link.active { background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.15); }
        .content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .page-title { font-size: 28px; margin-bottom: 14px; }
        .card { background: var(--card); padding: 24px; border-radius: 20px; border: 1px solid var(--line); margin-bottom: 25px; }
        .field { color: var(--muted); margin-bottom: 10px; }
        .btn { padding: 12px 18px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; color: white; font-size: 14px; }
        .btn-blue { background: var(--accent); }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); }
        .btn-gray { background: #1f2937; }
        textarea { width: 100%; min-height: 400px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--text); font-family: 'Monaco', 'Menlo', monospace; font-size: 14px; line-height: 1.5; resize: vertical; }
        .actions { display: flex; gap: 12px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="sidebar">
    <a href="/" class="logo">ALFA<span>CORE</span></a>
    <span class="nav-label">Main Console</span>
    <a href="/" class="nav-link">Dashboard</a>
    <span class="nav-label" style="margin-top:20px;">Services</span>
    <a href="/proxy" class="nav-link">Proxy Server</a>
    <a href="/firewall" class="nav-link">Firewall</a>
    <a href="/logs" class="nav-link">Access Logs</a>
    <a href="/network" class="nav-link {{ 'active' if service_key in ['dhcp-server', 'ethernet'] else '' }}">Networks</a>
    <a href="/vpns" class="nav-link {{ 'active' if service_key in ['ipsec', 'ssl', 'ssh', 'vpn', 'ocserv'] else '' }}">VPNs</a>
    <div style="margin-top:auto;"><a href="/logout" class="nav-link" style="color:var(--red)">Logout</a></div>
</div>
<div class="content">
    <div class="page-title">{{ service_label }} Configuration</div>
    <div class="card">
        <p class="field">Configuration File: <strong>{{ config_path }}</strong></p>
        <form action="/service/{{ service_key }}/config" method="post">
            <textarea name="config_content" placeholder="Configuration content...">{{ config_content }}</textarea>
            <div class="actions">
                <button type="submit" class="btn btn-green">Save Configuration</button>
                <a href="/service/{{ service_key }}" class="btn btn-gray" style="text-decoration: none; display: inline-block;">Back to Service</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
